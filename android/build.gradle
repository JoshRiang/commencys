allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

// The vibration 2.x plugin module compiles against android-33 while its
// transitive androidx deps require compileSdk 34+; force all plugin
// subprojects up (app-level compileSdk does not propagate into them).
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty("android")) {
            project.android.compileSdk = 34
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
