allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

// The vibration 2.x plugin module compiles against android-33 while its
// transitive androidx deps require compileSdk 34+; force all plugin
// library subprojects up (app-level compileSdk does not propagate into
// them). withPlugin (not afterEvaluate) runs during each subproject's own
// evaluation, before AGP creates variants.
subprojects {
    pluginManager.withPlugin("com.android.library") {
        android.compileSdk = 34
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
