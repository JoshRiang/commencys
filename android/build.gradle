// Resolve Android and Kotlin plugins from the standard public repositories.
allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Keep generated Gradle outputs under android/build so the repository root stays uncluttered.
rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

// Remove only generated Gradle outputs when the team runs the clean task.
tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
