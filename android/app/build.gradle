// Configure the Flutter Android host and the native home-screen widget providers.
// Keep the Java/Kotlin bytecode target compatible with the Flutter Android plugins.
plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.commencys.app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    // Flutter supplies the SDK and NDK versions selected by the installed Flutter toolchain.
    // Java 11 bytecode keeps the app compatible with the declared Android minimum SDK.
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    defaultConfig {
        applicationId = "com.commencys.app"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        // Match the native AppAuth callback scheme registered in the Keycloak realm.
        manifestPlaceholders += [appAuthRedirectScheme: "com.commencys.app"]
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
